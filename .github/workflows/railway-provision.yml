name: Railway provision

# Creates everything the rosary needs inside an existing Railway project, then
# deploys and checks that the public address really serves the app.
#
# The token is taken as an input rather than a secret. That value is recorded in
# this run's metadata, so treat it as spent: rotate it in Railway once the
# project is up, and move to a repository secret for anything routine.

on:
  workflow_dispatch:
    inputs:
      railway_token:
        description: 'Railway PROJECT token (revoke it after this run)'
        required: true
      service:
        description: 'Name for the application service'
        required: false
        default: 'Rosary'

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SERVICE: ${{ inputs.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g @railway/cli

      - name: Keep the token out of the logs
        env:
          TOKEN: ${{ inputs.railway_token }}
        run: |
          echo "::add-mask::$TOKEN"
          echo "RAILWAY_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: What is in the project already?
        run: |
          set -x
          railway status --json > status.json || railway status --json || true
          cat status.json || true

      - name: The database
        run: |
          set -euo pipefail
          if grep -qi '"name": *"Postgres"' status.json 2>/dev/null; then
            echo 'Postgres is already there.'
          else
            echo 'Adding Postgres.'
            railway add --database postgres --json
          fi

      - name: The application service
        run: |
          set -euo pipefail
          if grep -q "\"name\": *\"$SERVICE\"" status.json 2>/dev/null; then
            echo "$SERVICE is already there."
          else
            echo "Adding $SERVICE."
            railway add --service "$SERVICE" --json
          fi

      - name: Wire the two together
        run: |
          set -euo pipefail

          # The literal Railway reference is assembled here rather than written
          # out, because the sequence that opens it is also how GitHub Actions
          # opens an expression.
          OPEN='${'
          DB_REF="${OPEN}{Postgres.DATABASE_URL}}"

          railway variable set "DATABASE_URL=$DB_REF" --service "$SERVICE" --skip-deploys
          railway variable set "PORT=3000" --service "$SERVICE" --skip-deploys

          # Generated here so it is never typed anywhere, and only once so that
          # sessions survive later deploys.
          if railway variable list --service "$SERVICE" --kv 2>/dev/null | grep -q '^SESSION_SECRET='; then
            echo 'SESSION_SECRET already set — left alone.'
          else
            SECRET="$(openssl rand -hex 32)"
            echo "::add-mask::$SECRET"
            railway variable set "SESSION_SECRET=$SECRET" --service "$SERVICE" --skip-deploys
            echo 'SESSION_SECRET generated and set.'
          fi

      - name: Deploy
        run: railway up --service "$SERVICE" --ci

      - name: The public address
        id: domain
        run: |
          set -euo pipefail
          railway domain --service "$SERVICE" --port 3000 --json > domain.json 2>&1 || \
            railway domain list --service "$SERVICE" --json > domain.json
          cat domain.json
          URL="$(grep -oE '[a-zA-Z0-9.-]+\.up\.railway\.app' domain.json | head -1)"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Address: https://$URL"

      - name: Does it actually serve the rosary?
        run: |
          set -euo pipefail
          URL='${{ steps.domain.outputs.url }}'
          if [ -z "$URL" ]; then echo 'No address to check.'; exit 1; fi

          for attempt in $(seq 1 40); do
            CODE="$(curl -s -o body.html -w '%{http_code}' "https://$URL" || echo 000)"
            if [ "$CODE" = "200" ] && grep -qi 'rosaire\|rosary' body.html; then
              echo "Serving on attempt $attempt."
              echo "::notice title=Le rosaire est en ligne::https://$URL"
              exit 0
            fi
            echo "attempt $attempt: HTTP $CODE — still starting"
            sleep 15
          done
          echo 'Never answered with the app.'
          tail -c 800 body.html || true
          exit 1

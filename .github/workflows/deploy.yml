name: Deploy

# Creates everything the rosary needs inside an existing Railway project, then
# deploys and checks that the public address really serves the app.
#
# Provisioning goes through Railway's GraphQL API rather than the CLI: a project
# token authenticates it directly, whereas the CLI's subcommands each want a
# linked project on disk and fail with "Project not found" without one.
#
# The token is taken as an input rather than a secret. That value is recorded in
# this run's metadata, so treat it as spent: rotate it in Railway once the
# project is up, and move to a repository secret for anything routine.

on:
  workflow_dispatch:
    inputs:
      railway_token:
        description: 'Railway PROJECT token (revoke it after this run)'
        required: true
      service:
        description: 'Name for the application service'
        required: false
        default: 'Rosary'

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SERVICE: ${{ inputs.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g @railway/cli

      - name: Keep the token out of the logs
        env:
          TOKEN: ${{ inputs.railway_token }}
        run: |
          echo "::add-mask::$TOKEN"
          echo "RAILWAY_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Read the project the token opens
        run: |
          set -euo pipefail
          railway --version

          railway status --json > status.json
          echo '--- project ---'
          jq '{id, name}' status.json
          echo '--- services ---'
          jq -r '.services.edges[]?.node | "\(.name)\t\(.id)"' status.json
          echo '--- environments ---'
          jq -r '.environments.edges[]?.node | "\(.name)\t\(.id)"' status.json

          PROJECT_ID="$(jq -r '.id // empty' status.json)"
          PROJECT_NAME="$(jq -r '.name // empty' status.json)"
          ENV_ID="$(jq -r '[.environments.edges[]?.node | select(.name=="production")][0].id // empty' status.json)"
          [ -n "$ENV_ID" ] || ENV_ID="$(jq -r '.environments.edges[0].node.id // empty' status.json)"

          if [ -z "$PROJECT_ID" ] || [ -z "$ENV_ID" ]; then
            echo '::error::The token does not resolve to a project and an environment.'
            exit 1
          fi

          {
            echo "PROJECT_ID=$PROJECT_ID"
            echo "PROJECT_NAME=$PROJECT_NAME"
            echo "ENV_ID=$ENV_ID"
          } >> "$GITHUB_ENV"

      - name: The application service
        run: |
          set -euo pipefail

          # One place to talk to Railway. Anything the API reports as an error
          # stops the run rather than being swallowed.
          gql() {
            jq -n --arg q "$1" --argjson v "$2" '{query:$q, variables:$v}' > payload.json
            curl -sS -X POST https://backboard.railway.com/graphql/v2 \
              -H "Project-Access-Token: $RAILWAY_TOKEN" \
              -H 'Content-Type: application/json' \
              --data @payload.json > reply.json
            if jq -e '.errors' reply.json >/dev/null; then
              echo '::error::Railway refused the call:'
              jq -r '.errors[].message' reply.json
              exit 1
            fi
            cat reply.json
          }

          SERVICE_ID="$(jq -r --arg s "$SERVICE" \
            '[.services.edges[]?.node | select(.name==$s)][0].id // empty' status.json)"

          if [ -n "$SERVICE_ID" ]; then
            echo "$SERVICE is already there: $SERVICE_ID"
          else
            echo "Creating $SERVICE."
            SERVICE_ID="$(gql 'mutation($input: ServiceCreateInput!) { serviceCreate(input: $input) { id name } }' \
              "$(jq -n --arg p "$PROJECT_ID" --arg n "$SERVICE" '{input:{projectId:$p, name:$n}}')" \
              | jq -r '.data.serviceCreate.id')"
            echo "Created: $SERVICE_ID"
          fi

          [ -n "$SERVICE_ID" ] && [ "$SERVICE_ID" != 'null' ] || { echo '::error::No service id.'; exit 1; }
          echo "SERVICE_ID=$SERVICE_ID" >> "$GITHUB_ENV"

      - name: Wire the service to the database
        run: |
          set -euo pipefail

          gql() {
            jq -n --arg q "$1" --argjson v "$2" '{query:$q, variables:$v}' > payload.json
            curl -sS -X POST https://backboard.railway.com/graphql/v2 \
              -H "Project-Access-Token: $RAILWAY_TOKEN" \
              -H 'Content-Type: application/json' \
              --data @payload.json > reply.json
            if jq -e '.errors' reply.json >/dev/null; then
              echo '::error::Railway refused the call:'
              jq -r '.errors[].message' reply.json
              exit 1
            fi
            cat reply.json
          }

          # The literal Railway reference is assembled here rather than written
          # out, because the sequence that opens it is also how GitHub Actions
          # opens an expression.
          OPEN='${'
          DB_REF="${OPEN}{Postgres.DATABASE_URL}}"

          EXISTING="$(gql 'query($projectId: String!, $environmentId: String!, $serviceId: String!) { variables(projectId: $projectId, environmentId: $environmentId, serviceId: $serviceId) }' \
            "$(jq -n --arg p "$PROJECT_ID" --arg e "$ENV_ID" --arg s "$SERVICE_ID" \
               '{projectId:$p, environmentId:$e, serviceId:$s}')" \
            | jq -r '[.data.variables // {} | keys[]] | join(",")')"
          echo "Already set: ${EXISTING:-none}"

          # Only minted once, so that live sessions survive later deploys.
          if echo ",$EXISTING," | grep -q ',SESSION_SECRET,'; then
            echo 'SESSION_SECRET left alone.'
            VARS="$(jq -n --arg db "$DB_REF" '{DATABASE_URL:$db, PORT:"3000", NODE_ENV:"production"}')"
          else
            SECRET="$(openssl rand -hex 32)"
            echo "::add-mask::$SECRET"
            VARS="$(jq -n --arg db "$DB_REF" --arg s "$SECRET" \
              '{DATABASE_URL:$db, PORT:"3000", NODE_ENV:"production", SESSION_SECRET:$s}')"
            echo 'SESSION_SECRET generated.'
          fi

          gql 'mutation($input: VariableCollectionUpsertInput!) { variableCollectionUpsert(input: $input) }' \
            "$(jq -n --arg p "$PROJECT_ID" --arg e "$ENV_ID" --arg s "$SERVICE_ID" --argjson v "$VARS" \
               '{input:{projectId:$p, environmentId:$e, serviceId:$s, variables:$v}}')" >/dev/null
          echo 'Variables set.'

      - name: Link the checkout to the project
        run: |
          set -euo pipefail

          # `railway up` reads the linkage from the CLI's own config rather than
          # from the token, so write it directly: `railway link` needs an account
          # token to enumerate workspaces, which a project token cannot do.
          mkdir -p "$HOME/.railway"
          jq -n \
            --arg path "$PWD" \
            --arg project "$PROJECT_ID" \
            --arg name "$PROJECT_NAME" \
            --arg env "$ENV_ID" \
            --arg service "$SERVICE_ID" \
            --arg serviceName "$SERVICE" \
            '{projects: {($path): {
                projectPath: $path,
                name: $name,
                project: $project,
                environment: $env,
                environmentName: "production",
                service: $service,
                serviceName: $serviceName
              }}}' > "$HOME/.railway/config.json"
          cat "$HOME/.railway/config.json"

          railway status || echo 'status still unhappy — the upload will tell us for certain'

      - name: Deploy
        run: |
          set -euo pipefail

          # Detached rather than streaming: `railway up --ci` tails the build and
          # does not always come back, which spent a whole job timeout doing
          # nothing visible. The upload returns at once and the deployment is
          # then followed through the API, which also yields the build log if it
          # goes wrong.
          railway up --service "$SERVICE" --environment "$ENV_ID" --detach

      - name: Follow the build
        run: |
          set -euo pipefail

          gql() {
            jq -n --arg q "$1" --argjson v "$2" '{query:$q, variables:$v}' > payload.json
            curl -sS -X POST https://backboard.railway.com/graphql/v2 \
              -H "Project-Access-Token: $RAILWAY_TOKEN" \
              -H 'Content-Type: application/json' \
              --data @payload.json > reply.json
            if jq -e '.errors' reply.json >/dev/null; then
              echo '::error::Railway refused the call:'
              jq -r '.errors[].message' reply.json
              exit 1
            fi
            cat reply.json
          }

          LATEST='query($input: DeploymentListInput!) { deployments(input: $input, first: 1) { edges { node { id status createdAt } } } }'
          SCOPE="$(jq -n --arg p "$PROJECT_ID" --arg e "$ENV_ID" --arg s "$SERVICE_ID" \
            '{input:{projectId:$p, environmentId:$e, serviceId:$s}}')"

          DEPLOY_ID=''
          STATUS=''
          for attempt in $(seq 1 90); do
            NODE="$(gql "$LATEST" "$SCOPE" | jq -r '.data.deployments.edges[0].node // empty')"
            [ -n "$NODE" ] || { echo "attempt $attempt: no deployment yet"; sleep 10; continue; }
            DEPLOY_ID="$(echo "$NODE" | jq -r '.id')"
            STATUS="$(echo "$NODE" | jq -r '.status')"
            echo "attempt $attempt: $STATUS"
            case "$STATUS" in
              SUCCESS) break ;;
              FAILED|CRASHED|REMOVED|SKIPPED) break ;;
            esac
            sleep 10
          done

          echo "DEPLOY_ID=$DEPLOY_ID" >> "$GITHUB_ENV"

          if [ "$STATUS" != 'SUCCESS' ]; then
            echo "::error::The deployment ended as $STATUS."
            echo '--- build log ---'
            gql 'query($deploymentId: String!) { buildLogs(deploymentId: $deploymentId, limit: 400) { message } }' \
              "$(jq -n --arg d "$DEPLOY_ID" '{deploymentId:$d}')" \
              | jq -r '.data.buildLogs[]?.message' | tail -200 || true
            echo '--- deploy log ---'
            gql 'query($deploymentId: String!) { deploymentLogs(deploymentId: $deploymentId, limit: 200) { message } }' \
              "$(jq -n --arg d "$DEPLOY_ID" '{deploymentId:$d}')" \
              | jq -r '.data.deploymentLogs[]?.message' | tail -100 || true
            exit 1
          fi
          echo 'Build succeeded.'

      - name: The public address
        id: domain
        run: |
          set -euo pipefail

          gql() {
            jq -n --arg q "$1" --argjson v "$2" '{query:$q, variables:$v}' > payload.json
            curl -sS -X POST https://backboard.railway.com/graphql/v2 \
              -H "Project-Access-Token: $RAILWAY_TOKEN" \
              -H 'Content-Type: application/json' \
              --data @payload.json > reply.json
            if jq -e '.errors' reply.json >/dev/null; then
              echo '::error::Railway refused the call:'
              jq -r '.errors[].message' reply.json
              exit 1
            fi
            cat reply.json
          }

          SCOPE="$(jq -n --arg p "$PROJECT_ID" --arg e "$ENV_ID" --arg s "$SERVICE_ID" \
            '{projectId:$p, environmentId:$e, serviceId:$s}')"

          URL="$(gql 'query($projectId: String!, $environmentId: String!, $serviceId: String!) { domains(projectId: $projectId, environmentId: $environmentId, serviceId: $serviceId) { serviceDomains { domain } customDomains { domain } } }' \
            "$SCOPE" | jq -r '[.data.domains.customDomains[]?.domain, .data.domains.serviceDomains[]?.domain][0] // empty')"

          if [ -z "$URL" ]; then
            echo 'No address yet — asking for one.'
            URL="$(gql 'mutation($input: ServiceDomainCreateInput!) { serviceDomainCreate(input: $input) { domain } }' \
              "$(jq -n --arg e "$ENV_ID" --arg s "$SERVICE_ID" \
                 '{input:{environmentId:$e, serviceId:$s, targetPort:3000}}')" \
              | jq -r '.data.serviceDomainCreate.domain')"
          fi

          [ -n "$URL" ] && [ "$URL" != 'null' ] || { echo '::error::No public address.'; exit 1; }
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Address: https://$URL"

      - name: Does it actually serve the rosary?
        run: |
          set -euo pipefail
          URL='${{ steps.domain.outputs.url }}'

          for attempt in $(seq 1 40); do
            CODE="$(curl -s -o body.html -w '%{http_code}' "https://$URL" || echo 000)"
            if [ "$CODE" = "200" ] && grep -qi 'rosaire\|rosary' body.html; then
              echo "Serving on attempt $attempt."
              echo "::notice title=Le rosaire est en ligne::https://$URL"
              exit 0
            fi
            echo "attempt $attempt: HTTP $CODE — still starting"
            sleep 15
          done
          echo 'Never answered with the app. What the container said:'
          tail -c 800 body.html || true
          jq -n --arg q 'query($deploymentId: String!) { deploymentLogs(deploymentId: $deploymentId, limit: 200) { message } }' \
                --argjson v "$(jq -n --arg d "$DEPLOY_ID" '{deploymentId:$d}')" \
                '{query:$q, variables:$v}' > payload.json
          curl -sS -X POST https://backboard.railway.com/graphql/v2 \
            -H "Project-Access-Token: $RAILWAY_TOKEN" \
            -H 'Content-Type: application/json' \
            --data @payload.json | jq -r '.data.deploymentLogs[]?.message' | tail -120 || true
          exit 1

name: Railway probe

# Is the rosary actually up? Read-only, no token, no deploy — just a request to
# the public address, reporting what came back. Useful whenever the app needs
# checking from outside without touching the deployment.

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Address to check'
        required: false
        default: 'https://rosary-production-471b.up.railway.app'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the address for the app
        run: |
          set -euo pipefail
          URL='${{ inputs.url }}'
          echo "Checking $URL"
          echo

          CODE="$(curl -sS -L -o body.html -w '%{http_code}' \
                  --max-time 30 "$URL" || echo 000)"
          echo "HTTP $CODE, $(wc -c < body.html) bytes"
          echo

          echo '--- what the page calls itself ---'
          grep -oiE '<title>[^<]*</title>' body.html | head -3 || echo '(no title)'
          echo
          echo '--- first 400 characters ---'
          head -c 400 body.html
          echo
          echo

          if [ "$CODE" != '200' ]; then
            echo "::error::The address answered $CODE rather than 200."
            exit 1
          fi
          if ! grep -qi 'rosaire\|rosary' body.html; then
            echo '::error::200, but the page is not the rosary.'
            exit 1
          fi
          echo "::notice title=Le rosaire répond::$URL"

      - name: And the sign-in route?
        run: |
          set -euo pipefail
          URL='${{ inputs.url }}'
          # A wrong password must be refused, not crash: that exercises the
          # database end to end, which a static page would not.
          CODE="$(curl -sS -o reply.json -w '%{http_code}' --max-time 30 \
                  -X POST "$URL/api/auth/login" \
                  -H 'Content-Type: application/json' \
                  --data '{"email":"probe@example.invalid","password":"not-a-real-password"}' || echo 000)"
          echo "POST /api/auth/login -> HTTP $CODE"
          head -c 300 reply.json
          echo
          case "$CODE" in
            400|401|403|404|422) echo 'Refused cleanly — the database answered.' ;;
            500|502|503|000)     echo "::error::The login route is broken ($CODE)."; exit 1 ;;
            *)                   echo "Unexpected $CODE — worth a look." ;;
          esac

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Rosaire">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf6ec"/>
      <stop offset="1" stop-color="#f1e6d4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0" stop-color="#a97b32" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#a97b32" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#paper)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <circle cx="256" cy="205" r="150" fill="none" stroke="#a97b32" stroke-opacity="0.45" stroke-width="2"/>

  <!-- Twenty beads around the loop; the larger ones are the Our Fathers. -->
  <g fill="#a97b32">
    <circle cx="256" cy="55" r="13"/><circle cx="302" cy="62" r="9"/><circle cx="343" cy="83" r="9"/>
    <circle cx="374" cy="115" r="9"/><circle cx="393" cy="156" r="9"/><circle cx="399" cy="201" r="9"/>
    <circle cx="393" cy="246" r="13"/><circle cx="372" cy="287" r="9"/><circle cx="341" cy="319" r="9"/>
    <circle cx="300" cy="340" r="9"/><circle cx="256" cy="347" r="9"/><circle cx="212" cy="340" r="9"/>
    <circle cx="171" cy="319" r="13"/><circle cx="140" cy="287" r="9"/><circle cx="119" cy="246" r="9"/>
    <circle cx="113" cy="201" r="9"/><circle cx="119" cy="156" r="9"/><circle cx="138" cy="115" r="13"/>
    <circle cx="169" cy="83" r="9"/><circle cx="210" cy="62" r="9"/>
    <circle cx="256" cy="378" r="15"/>
  </g>
  <line x1="256" y1="393" x2="256" y2="414" stroke="#a97b32" stroke-opacity="0.6" stroke-width="2"/>

  <!-- The crucifix, with the body on it. -->
  <g fill="#4a3728">
    <rect x="248" y="414" width="16" height="88" rx="3"/>
    <rect x="211" y="440" width="90" height="16" rx="3"/>
  </g>
  <g fill="#ecdcbe">
    <rect x="222" y="445" width="68" height="6" rx="3"/>
    <rect x="251" y="451" width="10" height="30" rx="4"/>
    <circle cx="256" cy="436" r="7"/>
  </g>
</svg>
